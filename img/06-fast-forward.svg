<svg xmlns="http://www.w3.org/2000/svg" width="720" height="416" viewBox="0 0 720 416" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Merge fast-forward</title>
  <desc id="desc">Antes del merge, main está en e0b6e16 y agregar-archivo en da84d36. Después de git merge agregar-archivo, el historial es una sola línea y main avanzó hasta da84d36, igual que agregar-archivo. No se creó ningún commit nuevo.</desc>
  <style>
    .t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .hash{font-size:13px;fill:#6b7280}
    .msg{font-size:13px;fill:#1f2937}
    .head{font-size:14px;font-weight:700;fill:#1f2937}
    .tag{font-size:13px;font-weight:600;fill:#fff}
    .here{font-size:13px;fill:#6b7280;font-style:italic}
    .old{font-size:12px;fill:#9ca3af}
    .note{font-size:13px;fill:#4b5563}
  </style>
  <rect x="0.5" y="0.5" width="719" height="415" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- ANTES -->
  <text class="t head" x="32" y="36">Antes del merge</text>

  <line x1="40" y1="160" x2="206" y2="160" stroke="#d1d5db" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text class="t old" x="110" y="194" text-anchor="middle">commits anteriores</text>

  <path d="M220 146 Q220 90 290 90 L386 90" fill="none" stroke="#ea580c" stroke-width="4"/>

  <circle cx="220" cy="160" r="14" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <text class="mono hash" x="220" y="194" text-anchor="middle">e0b6e16</text>
  <rect x="248" y="148" width="56" height="24" rx="12" fill="#2563eb"/>
  <text class="t tag" x="276" y="165" text-anchor="middle">main</text>
  <text class="t here" x="316" y="165">← estás aquí</text>

  <circle cx="400" cy="90" r="14" fill="#ea580c" stroke="#ffffff" stroke-width="3"/>
  <text class="mono hash" x="400" y="124" text-anchor="middle">da84d36</text>
  <text class="t msg" x="400" y="62" text-anchor="middle">+ nuevo.php</text>
  <rect x="428" y="78" width="140" height="24" rx="12" fill="#ea580c"/>
  <text class="t tag" x="498" y="95" text-anchor="middle">agregar-archivo</text>

  <line x1="24" y1="222" x2="696" y2="222" stroke="#e5e7eb"/>

  <!-- DESPUÉS -->
  <text class="t head" x="32" y="256">Después de <tspan class="mono" font-weight="400">git merge agregar-archivo</tspan></text>

  <line x1="40" y1="322" x2="206" y2="322" stroke="#d1d5db" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <line x1="234" y1="322" x2="386" y2="322" stroke="#2563eb" stroke-width="4"/>

  <circle cx="220" cy="322" r="14" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <text class="mono hash" x="220" y="356" text-anchor="middle">e0b6e16</text>

  <circle cx="400" cy="322" r="14" fill="#ea580c" stroke="#ffffff" stroke-width="3"/>
  <text class="mono hash" x="400" y="356" text-anchor="middle">da84d36</text>
  <rect x="428" y="276" width="140" height="24" rx="12" fill="#ea580c"/>
  <text class="t tag" x="498" y="293" text-anchor="middle">agregar-archivo</text>
  <rect x="428" y="310" width="56" height="24" rx="12" fill="#2563eb"/>
  <text class="t tag" x="456" y="327" text-anchor="middle">main</text>
  <text class="t here" x="496" y="327">← estás aquí</text>

  <text class="t note" x="32" y="392"><tspan font-weight="600">main</tspan> avanzó hasta <tspan class="mono">da84d36</tspan>. No se creó ningún commit nuevo.</text>
</svg>
